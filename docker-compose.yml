services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: baan-laundry-api:latest
    container_name: baan-laundry-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # frontend admin บน VPS — คั่นด้วย comma ได้ถ้ามีหลาย origin
      CORS_ORIGIN: ${CORS_ORIGIN:-http://187.52.125.210:3000}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-}
      DB_PASS: ${DB_PASS:-}
      DB_NAME: ${DB_NAME:-}
    volumes:
      # เก็บไฟล์อัปโหลดข้าม container recreate
      - api_upload:/app/upload
    extra_hosts:
      # ให้ container เรียก Postgres บน host VPS ผ่าน host.docker.internal ได้
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/laundry/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  api_upload:
